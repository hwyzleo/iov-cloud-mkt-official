# 寒微雅致 HWYZ 官网（纯静态站点）nginx 配置
# 本文件被 /etc/nginx/nginx.conf 的 include conf.d/*.conf 引入，处于 http 上下文，
# 因此可以在此声明 map。
#
# 缓存策略用 map 集中表达，这样 add_header 只需在 server 级声明一次：
# nginx 的 add_header 在子 location 中出现会覆盖父级继承，集中声明可避免逐个 location 复述。
#
# 注意 dist 目录结构：public/assets/ 与 Vite 的 hash 产物都落在 /assets/ 下，
# 所以不能按目录区分缓存时长，只能按扩展名区分：
#   /assets/index-<hash>.{js,css}        带内容 hash  -> 1 年 immutable
#   /assets/brand|vehicles/*.{png,webp}  文件名固定   -> 7 天
map $uri $cache_control {
    default            "public, max-age=604800";
    "/"                "no-cache, no-store, must-revalidate";
    "/index.html"      "no-cache, no-store, must-revalidate";
    "/health"          "no-store";
    ~*\.(?:js|css)$    "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    server_tokens off;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;

    # text/html 由 nginx 默认压缩，无需列出；图片（png/jpeg/webp）已是压缩格式，不再压。
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # 单页 8 分区锚点导航，无客户端路由：
    # 不做 /index.html 回退，未命中的路径必须返回 404，避免搜索引擎收录重复首页。
    location / {
        try_files $uri $uri/ =404;
    }
}
